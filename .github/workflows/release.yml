name: Build and Auto-Release
on:
  push:
    tags:
      - 'v*' # Запускается автоматически, когда ты пушишь тег версии (например, v0.6.0)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код из твоего приватного репозитория
      - name: Checkout Private Code
        uses: actions/checkout@v4

      # 2. Настраиваем Java 21 в облаке
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Настраиваем кэширование Gradle для быстрой сборки
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Собираем мод и публикуем его на Modrinth, CurseForge и в твой Maven
      - name: Build and Publish Mod Assets
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # Даем права на запуск скрипта Gradle в Linux-окружении гитхаба
          chmod +x gradlew
          # Запускаем сборку и твои настроенные таски публикации
          ./gradlew build publishMods publish

      # 5. Автоматически синхронизируем паблик под ОДНИМ коммитом
      - name: Sync and Push to Public Repository (Squashed Commit)
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Клонируем твой публичный репозиторий (с дефисом)
          git clone https://$PUBLIC_TOKEN@github.com/dertex909/Complexity-Analyzer.git public_repo
          
          # Синхронизируем все файлы (копируем всё из привата в паблик, исключая системный гит-хлам)
          rsync -av --delete --exclude='.git' --exclude='build' --exclude='.gradle' --exclude='.github' ./ public_repo/
          
          # Переходим в папку публичного репо, фиксируем изменения одним коммитом и пушим
          cd public_repo
          git add .
          git commit -m "Release ${{ github.ref_name }} - Production Build" || echo "No changes to commit"
          git push origin neoforge-1.21.1