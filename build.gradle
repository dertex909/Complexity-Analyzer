plugins {
    id("java-library")
    id("maven-publish")
    id("idea")
    id("net.neoforged.moddev").version("2.0.144")
    id("me.modmuss50.mod-publish-plugin").version("2.2.0")
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
idea.module.downloadSources = true
idea.module.downloadJavadoc = true
sourceSets.main.resources.srcDir("src/generated/resources")

neoForge {
    version = project.neo_version
    mods.create(mod_id).sourceSet(sourceSets.main)

    runs {
        client.client()

        server {
            server()
            programArgument("--nogui")
        }

        gameTestServer.type = "gameTestServer"

        data {
            data()
            programArguments.addAll(
                    "--mod", project.mod_id, "--all",
                    "--output", file("src/generated/resources/").path,
                    "--existing", file("src/main/resources/").path
            )
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
            logLevel = org.slf4j.event.Level.DEBUG
            additionalRuntimeClasspathConfiguration.extendsFrom(project.configurations.implementation)
        }
    }
}

String http = "io.netty:netty-codec-http:${netty_codec_http_version}"
String zstd = "com.github.luben:zstd-jni:${zstd_jni_version}"

String jei = "mezz.jei:jei-${minecraft_version}-neoforge:19.25.0.325"

dependencies {
    implementation(http)
    jarJar(http)

    implementation(zstd)
    jarJar(zstd)

    runtimeOnly(jei)
}

processResources {
    exclude("**/*.py")

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: "[${minecraft_version}]",
            neo_version            : neo_version,
            neo_version_range      : "[${neo_version},)",
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties(replaceProperties)

    filesMatching("META-INF/neoforge.mods.toml") { expand(replaceProperties) }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = "Release v${mod_version}"
    type = ALPHA
    modLoaders.add("neoforge")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "RQjlpUyI"
        minecraftVersions.add(minecraft_version)
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1377875"
        minecraftVersions.add(minecraft_version)
        server = true
        client = false
    }
}