modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/dertex909/Complexity-Analyzer/issues"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
displayURL = "https://modrinth.com/project/complexity-analyzer"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
versionRange = "${neo_version_range}"

[[dependencies."${mod_id}"]]
modId = "minecraft"
versionRange = "${minecraft_version_range}"

[[dependencies."${mod_id}"]]
modId = "alltheleaks"
type = "incompatible"
reason = "Incompatible with AllTheLeaks due to multithreaded recipe harvesting conflicts."