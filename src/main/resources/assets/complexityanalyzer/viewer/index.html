<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Complexity Analyzer — Viewer</title>
    <link href="css/theme.css" rel="stylesheet">
    <link href="css/layout.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
</head>
<body>
<div class="workspace">
    <aside class="sidebar-left">
        <div class="sidebar-header">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="sidebar-title">Categories</div>
                <button class="sidebar-toggle-btn" id="sidebar-hide-btn" title="Hide Categories">
                    <svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                         viewBox="0 0 24 24" width="14">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>
            <div class="status">
                <span class="dot idle" id="status-dot"></span>
                <span id="status-text">initializing…</span>
            </div>
        </div>
        <nav class="tabs" id="main-tabs" role="tablist">
            <button class="tab" data-tab="overview" role="tab">Overview</button>
            <button class="tab" data-tab="items" role="tab">Items</button>
            <div class="sub-tabs-container" id="item-sub-tabs"></div>
            <button class="tab" data-tab="fluids" role="tab">Fluids</button>
            <div class="sub-tabs-container" id="fluid-sub-tabs"></div>
            <button class="tab" data-tab="mobs" role="tab">Mobs</button>
            <div class="sub-tabs-container" id="mob-sub-tabs"></div>
            <button class="tab" data-tab="sources" role="tab">Base Sources</button>
            <button class="tab" data-tab="graph" role="tab">Graph</button>
        </nav>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer"></div>

    <main id="main-content">
        <section class="panel" hidden id="tab-overview"></section>
        <section class="panel active" id="tab-items"></section>
        <section class="panel" hidden id="tab-item-recipes"></section>
        <section class="panel" hidden id="tab-item-machine-recipes"></section>
        <section class="panel" hidden id="tab-item-uses"></section>
        <section class="panel" hidden id="tab-item-base-sources"></section>
        <section class="panel" hidden id="tab-fluids"></section>
        <section class="panel" hidden id="tab-fluid-recipes"></section>
        <section class="panel" hidden id="tab-fluid-uses"></section>
        <section class="panel" hidden id="tab-mobs"></section>
        <section class="panel" hidden id="tab-mob-drops"></section>
        <section class="panel" hidden id="tab-sources"></section>
        <section class="panel" hidden id="tab-graph">
            <canvas id="graph-canvas"></canvas>
            <div class="graph-overlay" id="graph-overlay"></div>
        </section>

        <div class="modal-overlay" hidden id="item-modal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="item-modal-title">Item Info</h3>
                    <button class="modal-close" id="item-modal-close">&times;</button>
                </div>
                <div class="modal-body" id="item-modal-body"></div>
            </div>
        </div>

        <div class="modal-overlay" hidden id="fluid-modal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="fluid-modal-title">Fluid Info</h3>
                    <button class="modal-close" id="fluid-modal-close">&times;</button>
                </div>
                <div class="modal-body" id="fluid-modal-body"></div>
            </div>
        </div>

        <div class="modal-overlay" hidden id="mob-modal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="mob-modal-title">Mob Info</h3>
                    <button class="modal-close" id="mob-modal-close">&times;</button>
                </div>
                <div class="modal-body" id="mob-modal-body"></div>
            </div>
        </div>
    </main>
</div>

<div class="search-overlay" hidden id="search-overlay">
    <div class="search-box">
        <label class="visually-hidden" for="global-search">Search</label>
        <input autocomplete="off" id="global-search" placeholder="Search items, mobs, fluids… (Ctrl+K)" type="search">
        <div class="search-results-overlay" id="search-results-overlay"></div>
    </div>
</div>

<footer class="footer">
    <span id="footer-left">—</span>
    <span id="footer-right">format 0x0102</span>
</footer>

<button class="sidebar-show-btn" id="sidebar-show-btn" title="Show Categories">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
</button>

<script src="js/app.js" type="module"></script>
</body>
</html>
